# The two places a prompt can go.
#
# gemma   the vLLM server 60-model.sh runs on an H100 in this cluster. Plain
#         in-cluster HTTP, no credential: it never leaves Berlin.
# gemini  Google's Gemini API, reached through Cloud NAT. The API key lives in a
#         Kubernetes Secret because GCD has no Secret Manager; the client never
#         sees it, the gateway adds it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: gemma
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai:
        model: gemma-3-27b-it
      host: llm.model.svc.cluster.local
      port: 8080
      path: /v1/chat/completions
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: gemini
  namespace: agentgateway-system
spec:
  # The openai provider against Gemini's OpenAI-compatible endpoint, not the
  # gemini provider: that one calls the native generateContent API with the key
  # as a Bearer token, which the native API refuses for the new AQ.-format keys
  # ("Expected OAuth 2 access token"). This endpoint accepts them as Bearer.
  ai:
    provider:
      openai:
        model: gemini-3.8-flash
      host: generativelanguage.googleapis.com
      port: 443
      path: /v1beta/openai/chat/completions
  policies:
    tls:
      sni: generativelanguage.googleapis.com
    auth:
      secretRef:
        name: gemini-secret
