# A second Gateway, for model traffic only. The semantic router is an extProc with
# Buffered bodies; attached to agentgateway-proxy it would also buffer the MCP
# Streamable HTTP / SSE responses on that gateway, and tool calls would hang.
# The class-level EnterpriseAgentgatewayParameters size and label these pods.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-models
  namespace: agentgateway-system
spec:
  gatewayClassName: enterprise-agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
