# Targets the agentgateway-models ListenerSet, NOT the Gateway: on the Gateway the
# buffering would also apply to MCP streams (see listenerset.yaml).
#
# The router runs at PreRouting, so its x-selected-model header exists before the
# HTTPRoute picks a rule. Buffered request bodies are mandatory: the router has to
# read the prompt, and without them it classifies while its output is dropped.
#
# FailOpen, deliberately, and safe only because of routes.yaml: if the router is
# down no header is set, the request falls to the last rule, and that rule is
# Gemma. A router outage keeps traffic in Berlin rather than refusing it.
#
# Response bodies are NOT sent (None). The router decides on the request alone;
# with Buffered responses agentgateway held the whole streamed answer until the
# model finished (first token at ~5s instead of ~0.1s), so the demo's text arrived
# in one lump. Response headers still go, so the router's x-vsr-* headers survive.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: semantic-routing
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: agentgateway-models
  traffic:
    phase: PreRouting
    # Conditional: the router is an LLM router and rejects anything that is not
    # a chat completions body (it answered an upload POST to /tub/summarize with
    # a DirectResponse 400 "missing required field: model" before routing).
    # Everything else on the listener goes straight to its route.
    extProc:
      conditional:
        - condition: request.path == "/v1/chat/completions"
          policy:
            backendRef:
              name: semantic-router
              namespace: agentgateway-system
              port: 50051
            processingOptions:
              requestHeaderMode: Send
              requestBodyMode: Buffered
              responseHeaderMode: Send
              responseBodyMode: None
              allowModeOverride: true
            failureMode: FailOpen
