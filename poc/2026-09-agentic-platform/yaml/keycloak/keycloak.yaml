# Keycloak, adapted from the kind lab for GKE Autopilot on GCD.
#
# Three changes from the kind original, all forced by the environment:
#
#  1. KC_HOSTNAME is templated (${ISSUER_URL}) rather than hard-coded to
#     keycloak.localtest.me. On GCD a Cloud DNS PRIVATE zone resolves the
#     hostname in-cluster and the same name points at the regional external ALB
#     from outside, so ONE issuer string works in the browser and in the pods.
#     That removes the kind lab's hostAlias bridge entirely — the single biggest
#     simplification in the port.
#  2. Resource requests on every container. Autopilot admission requires them
#     and will rewrite or reject a pod without them.
#  3. No hostAliases anywhere. Nothing needs them now.
#
# Still dev-mode (in-memory H2). For a real customer template this should run
# in production mode against the Cloud SQL instance — noted in PLAN.md phase 5.
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels: { app: keycloak }
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
    - { name: http-8080, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: keycloak
spec:
  serviceName: keycloak
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      containers:
        - name: keycloak
          image: ${KEYCLOAK_IMAGE}
          # REQUIRED on Autopilot, not optional tuning. A container that does
          # not request cpu/memory is DEFAULTED by Autopilot to 500m and 2Gi,
          # and that default is a real reservation against the cluster's CPU
          # quota -- on GCD, which is C3-only with 24 vCPU in this project,
          # that is 2% of everything for a component that idles near zero.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          args: [start-dev, --import-realm]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: "${KEYCLOAK_ADMIN_PASSWORD}" }
            - { name: KC_HTTP_RELATIVE_PATH, value: / }
            # The one issuer string, resolvable from both sides.
            - { name: KC_HOSTNAME, value: "${ISSUER_URL}" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            # Keycloak sits behind two proxies here: the regional external ALB
            # and then agentgateway. Trust the forwarded headers.
            - { name: KC_PROXY_HEADERS, value: "xforwarded" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /realms/master, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 1, memory: 2Gi }
          volumeMounts:
            - { name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm-import
          configMap: { name: keycloak-realm-import }
