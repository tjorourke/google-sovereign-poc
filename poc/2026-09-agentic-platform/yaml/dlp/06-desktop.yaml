# Port of Kernwerk's EKS 07-desktop.yaml.tmpl: the same reader -> AGW Messages
# conversion -> protected OpenAI model-route flow, using Berlin's existing IdP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trustusbank-desktop
  namespace: agentgateway-system
spec:
  parentRefs:
  - {group: gateway.networking.k8s.io, kind: ListenerSet, name: agentgateway-models}
  hostnames: ["agw.__BASE_DOMAIN__"]
  rules:
  - name: reader
    matches:
    - path: {type: PathPrefix, value: /trustusbank/v1/messages}
    backendRefs:
    - {name: trustusbank-pii, port: 8081}
  - name: open
    matches:
    - path: {type: PathPrefix, value: /trustusbank-open/v1/messages}
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set: [{name: x-selected-model, value: gemma-3-27b-it}]
    backendRefs:
    - {name: trustusbank-desktop, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend}
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: trustusbank-desktop
  namespace: agentgateway-system
spec:
  ai:
    provider:
      # Berlin's build prefers Responses for a generic OpenAI provider. The
      # protected route and VSR expect Chat Completions, so advertise only it.
      custom:
        model: gemma-3-27b-it
        providerOverride: openai
        formats: [{type: Completions, path: /v1/chat/completions}]
      # Conversion re-enters this same proxy's model listener. Loopback avoids
      # Kubernetes self-Service hairpinning; authority selects the model route.
      host: 127.0.0.1
      port: 80
  policies:
    transformation:
      request:
        set:
        - name: host
          value: '"agw.__BASE_DOMAIN__"'
    ai:
      routes:
        "/trustusbank-open/v1/messages": Messages
        "/trustusbank-open/v1/messages/count_tokens": AnthropicTokenCount
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: trustusbank-desktop-auth
  namespace: agentgateway-system
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: trustusbank-desktop}
  traffic:
    timeouts: {request: 300s}
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
      - issuer: https://keycloak.__BASE_DOMAIN__/realms/agentregistry
        jwks:
          remote: {url: http://keycloak.keycloak.svc.cluster.local/realms/agentregistry/protocol/openid-connect/certs}
