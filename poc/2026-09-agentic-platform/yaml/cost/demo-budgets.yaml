  namespace: agentgateway-system
  labels: {company: trustusbank, demo.solo.io/scenario: cost-management}
spec:
  budgets:
  - name: finance-payments-operations
    subject: {group: payments-ops}
    limit: {amount: 90, unit: USD}
    window: {unit: Week}
    onBudgetExceeded: Audit
