# Five independently editable rows in AGW Cost Management.
# Seeded ClickHouse history is distinct from live enforcement-counter usage.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBudget
metadata:
  name: developer-daily
  namespace: agentgateway-system
  labels: {company: trustusbank, demo.solo.io/scenario: cost-management}
spec:
  budgets:
  # A per-developer daily cap. The subject is the demo sign-in user.
  - name: developer-daily
    subject: {user: bob}
    limit: {amount: 5, unit: USD}
    window: {unit: Day}
    onBudgetExceeded: Block
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBudget
