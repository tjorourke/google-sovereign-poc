# Five independently editable rows in AGW Cost Management.
# Seeded ClickHouse history is distinct from live enforcement-counter usage.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBudget
metadata:
  name: developer-daily
  namespace: agentgateway-system
  labels: {company: trustusbank, demo.solo.io/scenario: cost-management}
spec:
  budgets:
  # The demo sign-in user's frontier-model allowance: Gemma is unmetered (free,
  # in-boundary), Gemini burns a daily token budget and then Blocks. Sized so a
  # routing-page answer or two (~0.6-2.2k tokens with thinking) fits, and the next
  # one trips it live on stage. USD amounts are whole-dollar, so a token limit is
  # the only cap small enough to demonstrate.
  - name: developer-daily
    subject: {user: bob, model: gemini-3.8-flash}
    limit: {amount: 2500, unit: Tokens}
    window: {unit: Day}
    onBudgetExceeded: Block
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
