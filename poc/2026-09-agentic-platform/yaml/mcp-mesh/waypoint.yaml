# Every MCP server behind one agentgateway waypoint, so the gateway sees who calls.
#
# An agent in an ambient namespace that calls <svc>.mcp.svc.cluster.local is
# captured by ztunnel and carried over HBONE to this waypoint, which knows the
# caller's mesh identity (namespace + ServiceAccount, from its SPIFFE cert). The
# per-agent EnterpriseAgentgatewayPolicy (<agent>--<backend>, written by the
# demo console) then allows each agent only its approved tools; everyone else,
# including anything reaching the same backend through the edge gateway with no
# mesh identity, is denied. Same pattern as the EKS console's kagent AccessPolicy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-waypoint
  namespace: mcp
  labels: {company: trustusbank}
spec:
  gatewayClassName: enterprise-agentgateway-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank-payments-mesh
  namespace: mcp
  labels: {company: trustusbank}
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: bank-payments
  rules:
  - matches: [{path: {type: PathPrefix, value: /}}]
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: bank-payments-mcp
---
