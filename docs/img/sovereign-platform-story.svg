<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="inf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="mesh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="600" fill="#0f172a">Four pillars, one sovereign cluster — Solo on Google Cloud Dedicated, Berlin</text>
  <text x="24" y="52" font-size="13" fill="#475569">AgentRegistry decides what runs. agentgateway decides what it may call. Istio ambient decides who may talk to whom. kagent runs the agent.</text>

  <!-- ===================== catalogue / control plane band ===================== -->
  <rect x="24" y="72" width="952" height="86" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="40" y="90" font-size="11" font-weight="600" fill="#6d28d9">CATALOGUE &amp; DEPLOYER — no kubectl in this path</text>

  <rect x="40" y="98" width="150" height="48" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="115" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#4c1d95">arctl apply</text>
  <text x="115" y="134" font-size="10" text-anchor="middle" fill="#6d28d9">Deployment CR</text>

  <rect x="230" y="98" width="220" height="48" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="340" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#4c1d95">AgentRegistry</text>
  <text x="340" y="134" font-size="10" text-anchor="middle" fill="#6d28d9">resolves targetRef + runtimeRef, writes kagent CRs itself</text>

  <rect x="490" y="98" width="220" height="48" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="600" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#4c1d95">Postgres catalogue</text>
  <text x="600" y="134" font-size="10" text-anchor="middle" fill="#6d28d9">approved Agents + MCPServers, over PSC</text>

  <rect x="750" y="98" width="206" height="48" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.3"/>
  <text x="853" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">MCPServer.spec.remote</text>
  <text x="853" y="134" font-size="10" text-anchor="middle" fill="#92400e">points at agentgateway, never the tool Service</text>

  <path d="M190 122 L230 122" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#mesh)"/>
  <path d="M450 122 L490 122" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#mesh)"/>
  <path d="M710 122 L750 122" stroke="#b45309" stroke-width="1.6" marker-end="url(#mcp)"/>

  <!-- ===================== cluster boundary ===================== -->
  <rect x="24" y="176" width="952" height="500" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="40" y="196" font-size="12" font-weight="600" fill="#334155">GKE Autopilot cluster "agentic" — u-germany-northeast1</text>

  <!-- namespace: agentregistry-system -->
  <rect x="40" y="208" width="230" height="88" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="50" y="222" font-size="10" fill="#64748b">ns: agentregistry-system</text>
  <rect x="52" y="230" width="206" height="56" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="155" y="252" font-size="12" font-weight="600" text-anchor="middle" fill="#0c4a6e">sovereignagent</text>
  <text x="155" y="267" font-size="10" text-anchor="middle" fill="#0369a1">deployed by the registry, kagent-run</text>
  <text x="155" y="280" font-size="9.5" text-anchor="middle" fill="#0369a1">image has no model key, no tool URL baked in</text>

  <!-- namespace: kagent -->
  <rect x="290" y="208" width="230" height="88" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="300" y="222" font-size="10" fill="#64748b">ns: kagent</text>
  <rect x="302" y="230" width="206" height="56" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="405" y="252" font-size="12" font-weight="600" text-anchor="middle" fill="#0c4a6e">sovereign-calc</text>
  <text x="405" y="267" font-size="10" text-anchor="middle" fill="#0369a1">hand-written with kubectl</text>
  <text x="405" y="280" font-size="9.5" text-anchor="middle" fill="#0369a1">same gateway policy governs it too</text>

  <!-- namespace: agents (waypoint path) -->
  <rect x="540" y="208" width="220" height="88" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="550" y="222" font-size="10" fill="#64748b">ns: agents</text>
  <rect x="552" y="230" width="196" height="56" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="650" y="250" font-size="12" font-weight="600" text-anchor="middle" fill="#6d28d9">waypoint-calc</text>
  <text x="650" y="264" font-size="10" text-anchor="middle" fill="#7c3aed">behind an Istio ambient waypoint</text>
  <text x="650" y="277" font-size="9.5" text-anchor="middle" fill="#7c3aed">AccessPolicy: requests 3 tools, granted 1</text>

  <!-- Keycloak -->
  <rect x="790" y="208" width="182" height="88" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
  <text x="881" y="228" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Keycloak</text>
  <text x="881" y="244" font-size="10" text-anchor="middle" fill="#475569">single OIDC issuer</text>
  <text x="881" y="258" font-size="10" text-anchor="middle" fill="#475569">realm: agentregistry</text>
  <text x="881" y="274" font-size="9.5" text-anchor="middle" fill="#475569">issuer host re-pointed at the</text>
  <text x="881" y="286" font-size="9.5" text-anchor="middle" fill="#475569">gateway; iss string never changes</text>

  <!-- ambient mesh band -->
  <rect x="40" y="314" width="932" height="46" rx="7" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="56" y="332" font-size="11" font-weight="600" fill="#6d28d9">Istio ambient — istiod · istio-cni · ztunnel, admitted via GCD's privileged WorkloadAllowlist</text>
  <text x="56" y="348" font-size="10.5" fill="#7c3aed">every enrolled pod gets a SPIFFE identity and mTLS by default; A2A calls between agents are authorized by AccessPolicy at the callee's waypoint</text>

  <path d="M155 286 L155 314" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#mesh)"/>
  <path d="M405 286 L405 314" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#mesh)"/>
  <path d="M650 286 L650 314" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#mesh)"/>

  <!-- agentgateway band -->
  <rect x="40" y="382" width="932" height="80" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="56" y="402" font-size="13" font-weight="600" fill="#14532d">enterprise agentgateway — the one policy point for A2A, MCP and LLM traffic</text>
  <text x="56" y="420" font-size="10.5" fill="#166534">AgentgatewayPolicy.backend.mcp.authorization.policy.matchExpressions — a denied tool is not rejected, it never appears in tools/list</text>
  <text x="56" y="436" font-size="10.5" fill="#166534">tools/call on a denied tool: JSON-RPC -32602 "Unknown tool" · A2A to an unauthorized caller: 403 at the target's waypoint</text>
  <text x="56" y="452" font-size="10.5" fill="#166534">3 pods · 3 nodes · 3 zones · behind a PodDisruptionBudget — this gateway's availability is the platform's availability</text>

  <path d="M155 314 L155 382" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#a2a)"/>
  <path d="M405 314 L405 382" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#a2a)"/>
  <path d="M650 314 L650 382" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#a2a)"/>
  <path d="M881 296 L881 382" stroke="#64748b" stroke-width="1.4" fill="none" stroke-dasharray="3 4" marker-end="url(#inf)"/>
  <text x="895" y="345" font-size="10" fill="#64748b">OIDC discovery</text>

  <!-- tool server -->
  <rect x="80" y="494" width="330" height="86" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="245" y="514" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">MCP: sovereign-tools</text>
  <text x="245" y="531" font-size="10.5" text-anchor="middle" fill="#92400e">offers 5 tools: sum · reverse_text · echo · printenv · fetch</text>
  <text x="245" y="547" font-size="10.5" text-anchor="middle" fill="#b91c1c" font-weight="600">gateway policy grants only sum + reverse_text — the rest never discovered</text>
  <text x="245" y="563" font-size="9.5" text-anchor="middle" fill="#92400e">flip one matchExpression live → grant becomes echo → discovery changes, zero app changes</text>

  <!-- self-hosted model -->
  <rect x="440" y="494" width="270" height="86" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
  <text x="575" y="514" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">Gemma 3 27B on vLLM</text>
  <text x="575" y="531" font-size="10.5" text-anchor="middle" fill="#475569">1× H100 80GB, in-cluster · 39.8 tok/s</text>
  <text x="575" y="547" font-size="10.5" text-anchor="middle" fill="#475569">bfloat16, 200Gi hyperdisk weights cache</text>
  <text x="575" y="563" font-size="9.5" text-anchor="middle" fill="#475569">no aiplatform in GCD — this is Google's own reference design, self-hosted</text>

  <!-- observability -->
  <rect x="730" y="494" width="262" height="86" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
  <text x="861" y="514" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">ClickHouse + OTel + Enterprise UI</text>
  <text x="861" y="531" font-size="10.5" text-anchor="middle" fill="#475569">trace tree stamped in at deploy time</text>
  <text x="861" y="547" font-size="10.5" text-anchor="middle" fill="#475569">Start → agent (AGENT) → tool (TOOL) → End</text>
  <text x="861" y="563" font-size="9.5" text-anchor="middle" fill="#475569">Cloud Monitoring here ingests no custom/OTel metrics at all</text>

  <path d="M245 462 L245 494" stroke="#b45309" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#mcp)"/>
  <text x="255" y="480" font-size="10" fill="#b45309">MCP</text>
  <path d="M575 462 L575 494" stroke="#64748b" stroke-width="1.6" fill="none" stroke-dasharray="3 4" marker-end="url(#inf)"/>
  <text x="585" y="480" font-size="10" fill="#64748b">inference</text>
  <path d="M861 462 L861 494" stroke="#64748b" stroke-width="1.6" fill="none" stroke-dasharray="3 4" marker-end="url(#inf)"/>
  <text x="871" y="480" font-size="10" fill="#64748b">traces</text>

  <!-- legend -->
  <rect x="40" y="604" width="932" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="56" y1="620" x2="90" y2="620" stroke="#1d4ed8" stroke-width="2"/>
  <text x="98" y="624" font-size="10.5" fill="#334155">A2A (agent → agent, or agent → gateway)</text>
  <line x1="290" y1="620" x2="324" y2="620" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="332" y="624" font-size="10.5" fill="#334155">MCP (tool discovery + calls)</text>
  <line x1="520" y1="620" x2="554" y2="620" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 4"/>
  <text x="562" y="624" font-size="10.5" fill="#334155">model inference / telemetry</text>
  <line x1="740" y1="620" x2="774" y2="620" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="782" y="624" font-size="10.5" fill="#334155">mesh / catalogue control</text>
  <rect x="56" y="636" width="14" height="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="78" y="646" font-size="10.5" fill="#334155">waypoint = per-tool, per-caller enforcement point</text>
  <text x="420" y="646" font-size="10.5" fill="#334155" font-weight="600">Every hop above crosses a policy point. None of it lives in application code.</text>

  <!-- footer -->
  <text x="24" y="700" font-size="11.5" fill="#475569">Verified: 66-istio-health.sh 10/10 (ambient L4+L7) · 69-accesspolicy-health.sh 9/9 (all three agent paths) · 85-tls.sh --verify 5/5</text>
  <text x="24" y="718" font-size="11.5" fill="#475569">Everything on this diagram runs inside the German sovereign boundary: Berlin GCD, u-germany-northeast1, no public GCP dependency for any of it.</text>
  <text x="24" y="740" font-size="10.5" fill="#94a3b8">Solo.io · Google Cloud Dedicated, Berlin · eu0:soloio-eval</text>
</svg>
