<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="sd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="600" fill="#0f172a">TrustUsBank AG — fraud triage flow</text>
  <text x="24" y="54" font-size="13" fill="#475569">A held SEPA Instant transfer of EUR 9,850. Fourth to the same new counterparty in 18 minutes,</text>
  <text x="24" y="72" font-size="13" fill="#475569">against a normal weekly outflow of EUR 280.</text>

  <!-- lifeline heads -->
  <rect x="24" y="96" width="120" height="46" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="84" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">External</text>
  <text x="84" y="133" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">caller</text>

  <rect x="180" y="96" width="120" height="46" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <text x="240" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#14532d">agentgateway</text>
  <text x="240" y="133" font-size="11" text-anchor="middle" fill="#166534">edge</text>

  <rect x="336" y="96" width="132" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="402" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#0c4a6e">payment-triage</text>
  <text x="402" y="133" font-size="11" text-anchor="middle" fill="#0369a1">orchestrator</text>

  <rect x="504" y="96" width="132" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="570" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#0c4a6e">fraud-analysis</text>
  <text x="570" y="133" font-size="11" text-anchor="middle" fill="#0369a1">+ waypoint</text>

  <rect x="672" y="96" width="140" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="742" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#0c4a6e">sanctions-</text>
  <text x="742" y="133" font-size="12" font-weight="600" text-anchor="middle" fill="#0c4a6e">screening</text>

  <rect x="848" y="96" width="128" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="912" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">MCP servers</text>
  <text x="912" y="133" font-size="11" text-anchor="middle" fill="#92400e">+ waypoints</text>

  <!-- lifelines -->
  <line x1="84"  y1="142" x2="84"  y2="712" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="240" y1="142" x2="240" y2="712" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="402" y1="142" x2="402" y2="712" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="570" y1="142" x2="570" y2="712" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="742" y1="142" x2="742" y2="712" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="912" y1="142" x2="912" y2="712" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>

  <!-- 1 -->
  <line x1="84" y1="180" x2="234" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="90" y="174" font-size="11.5" fill="#0f172a">1. A2A message/send over HTTPS</text>

  <!-- 2 -->
  <line x1="240" y1="216" x2="396" y2="216" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="246" y="210" font-size="11.5" fill="#0f172a">2. a2a backend; L4 policy admits only the gateway</text>

  <!-- 3 -->
  <line x1="402" y1="256" x2="564" y2="256" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="408" y="250" font-size="11.5" fill="#0f172a">3. A2A "assess IBAN DE89…"</text>
  <text x="408" y="272" font-size="10.5" fill="#6d28d9">only payment-triage may call this desk; anyone else gets 403</text>

  <!-- 4 -->
  <line x1="570" y1="306" x2="906" y2="306" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="576" y="300" font-size="11.5" fill="#0f172a">4. MCP tools/list</text>

  <!-- 5 -->
  <line x1="906" y1="336" x2="576" y2="336" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text x="576" y="330" font-size="11.5" fill="#334155">5. get_account, list_transactions only</text>
  <text x="576" y="352" font-size="10.5" fill="#b91c1c">get_customer removed by AccessPolicy: the desk never sees customer PII</text>

  <!-- 6 -->
  <line x1="570" y1="386" x2="906" y2="386" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="576" y="380" font-size="11.5" fill="#0f172a">6. tools/call list_transactions</text>

  <!-- 7 -->
  <line x1="906" y1="416" x2="576" y2="416" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text x="576" y="410" font-size="11.5" fill="#334155">7. 4 transfers, EUR 31,400, "Volkov Trading OOO"</text>

  <!-- 8 -->
  <line x1="564" y1="450" x2="408" y2="450" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text x="408" y="444" font-size="11.5" fill="#334155">8. VERDICT: ANOMALOUS</text>

  <!-- 9 -->
  <line x1="402" y1="486" x2="736" y2="486" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="408" y="480" font-size="11.5" fill="#0f172a">9. A2A "screen Volkov Trading OOO"</text>

  <!-- 10 -->
  <line x1="742" y1="516" x2="906" y2="516" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="748" y="510" font-size="11.5" fill="#0f172a">10. screen_sanctions + check_pep</text>

  <!-- 11 -->
  <line x1="906" y1="546" x2="748" y2="546" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text x="612" y="540" font-size="11.5" fill="#334155">11. EU-2024-0412 match; PEP controller</text>

  <!-- 12 -->
  <line x1="736" y1="580" x2="408" y2="580" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text x="408" y="574" font-size="11.5" fill="#334155">12. VERDICT: BLOCK</text>

  <!-- 13 -->
  <line x1="402" y1="616" x2="906" y2="616" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="408" y="610" font-size="11.5" fill="#0f172a">13. tools/call create_case (severity HIGH) → CASE-4110</text>

  <!-- 14 denied -->
  <line x1="402" y1="656" x2="900" y2="656" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#sd)"/>
  <text x="408" y="650" font-size="11.5" font-weight="600" fill="#b91c1c">14. tools/call file_sar → not available to any agent</text>
  <text x="408" y="672" font-size="10.5" fill="#b91c1c">the GwG §43 filing stays with a named compliance officer</text>

  <!-- 15 -->
  <line x1="396" y1="700" x2="90" y2="700" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sr)"/>
  <text x="90" y="694" font-size="11.5" fill="#334155">15. FRAUD: ANOMALOUS · SANCTIONS: BLOCK · CASE-4110 · HANDOVER</text>

  <text x="24" y="740" font-size="11" fill="#64748b">Solid = request. Dashed grey = response. Red = refused by policy at the waypoint, not by the model.</text>
</svg>
