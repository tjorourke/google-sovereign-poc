  <text x="766" y="347" font-size="10" fill="#3c4043">runs the workers</text>
  <text x="766" y="364" font-size="9" fill="#5f6368" font-family="SF Mono, Menlo, Consolas, monospace">per WorkerPool</text>

  <rect x="880" y="308" width="116" height="80" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1.2"/>
  <text x="890" y="330" font-size="12" font-weight="700" fill="#202124">ate-idp-server</text>
