  <text x="884" y="478" font-size="12" font-weight="700" fill="#202124">agentgateway</text>
  <text x="884" y="495" font-size="10" fill="#3c4043">Solo Enterprise</text>
  <text x="884" y="511" font-size="9" fill="#5f6368" font-family="SF Mono, Menlo, Consolas, monospace">v2026.10.0</text>
  <text x="884" y="530" font-size="10" fill="#3c4043">holds the OpenAI key</text>

  <!-- atelet -->
  <rect x="228" y="650" width="780" height="50" rx="6" fill="#fff8e6" stroke="#c8a415" stroke-width="1.2"/>
  <text x="240" y="670" font-size="12" font-weight="700" fill="#202124">atelet DaemonSet · on every node</text>
  <text x="240" y="688" font-size="10" fill="#3c4043">gVisor runtime, actor files and snapshots in /var/lib/ate · allowlisted, so no exec or port-forward</text>

