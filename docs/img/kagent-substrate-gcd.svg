  <rect width="1280" height="860" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#202124">kagent 1.0 on Agent Substrate · Google Cloud Dedicated, Berlin</text>
  <text x="30" y="57" font-size="12" fill="#5f6368">Project eu0:soloio-eval · u-germany-northeast1 · every agent conversation and sandbox is a gVisor actor · verified 2026-10-21</text>

  <!-- ============ OPERATOR ============ -->
  <rect x="20" y="200" width="164" height="100" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1.2"/>
  <text x="32" y="222" font-size="13" font-weight="700" fill="#202124">Operator</text>
  <text x="32" y="240" font-size="11" fill="#3c4043">kagent CLI (A2A, MCP)</text>
  <text x="32" y="256" font-size="11" fill="#3c4043">kubectl ate</text>
  <text x="32" y="284" font-size="10" fill="#5f6368">WIF login + port-forward</text>

  <!-- ============ GOOGLE CLOUD DEDICATED ============ -->
  <rect x="196" y="72" width="844" height="664" rx="10" fill="#f8f9fa" stroke="#c4c7cc" stroke-width="1.2"/>
  <text x="212" y="92" font-size="11" font-weight="700" fill="#5f6368" letter-spacing="1.1">GOOGLE CLOUD DEDICATED · BERLIN (eu0)</text>

  <rect x="212" y="102" width="300" height="50" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1.2"/>
  <text x="224" y="122" font-size="12.5" font-weight="700" fill="#202124">Org policy · privileged admission</text>
  <text x="224" y="140" font-size="10" fill="#5f6368" font-family="SF Mono, Menlo, Consolas, monospace">exact gs:// paths, set before creation</text>

  <rect x="524" y="102" width="188" height="50" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1.2"/>
  <text x="536" y="122" font-size="12.5" font-weight="700" fill="#202124">Workforce Identity</text>
  <text x="536" y="140" font-size="10" fill="#5f6368">operator sign-in, ~1 h</text>

  <rect x="724" y="102" width="300" height="50" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1.2"/>
  <text x="736" y="122" font-size="12.5" font-weight="700" fill="#202124">Cloud Storage · agentic-allowlist</text>
  <text x="736" y="140" font-size="10" fill="#5f6368" font-family="SF Mono, Menlo, Consolas, monospace">WorkloadAllowlist files (Warden-made)</text>

  <!-- ============ GKE AUTOPILOT CLUSTER ============ -->
  <rect x="212" y="166" width="812" height="554" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"/>
  <text x="228" y="186" font-size="12" font-weight="700" fill="#202124">GKE Autopilot · cluster agentic · 1.36.4-gke.1391000<tspan font-weight="400" font-size="11" fill="#5f6368"> · certificate beta APIs on at creation</tspan></text>

  <!-- admission -->
  <rect x="228" y="196" width="780" height="72" rx="6" fill="#fff8e6" stroke="#c8a415" stroke-width="1"/>
  <text x="240" y="212" font-size="9.5" font-weight="700" fill="#8a6d00" letter-spacing="1">ADMISSION · GKE WARDEN</text>

  <rect x="240" y="220" width="144" height="42" rx="5" fill="#ffffff" stroke="#c8a415" stroke-width="1.2"/>
  <text x="312" y="237" font-size="10.5" font-weight="700" fill="#202124" text-anchor="middle">WorkloadAllowlist</text>
