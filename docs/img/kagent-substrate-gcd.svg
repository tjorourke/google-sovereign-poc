  <g font-size="11" fill="#3c4043">
    <text x="52" y="792">Operator: kagent CLI and kubectl ate, through a port-forward</text>
    <text x="472" y="792">kagent → ate-api: templates and sessions, gRPC over mTLS</text>
    <text x="892" y="792">ate-api places actors: resume, suspend, move between workers</text>
    <text x="52" y="816">A2A: kagent-controller → atenet-router → the session's actor</text>
    <text x="472" y="816">Actor egress, only to origins an EgressPolicy grants</text>
    <text x="892" y="816">agentgateway adds the OpenAI key; out through Cloud NAT</text>
    <text x="52" y="840">Suspend writes a snapshot to RustFS; resume restores it anywhere</text>
    <text x="472" y="840">Allowlists synced from Cloud Storage into the cluster</text>
    <text x="892" y="840">Image pulls over Cloud NAT from public registries</text>
  </g>
