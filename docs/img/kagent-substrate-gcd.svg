  <text x="428" y="366" font-size="9.5" fill="#5f6368" font-family="SF Mono, Menlo, Consolas, monospace">kagent 1.0.0-alpha16</text>

  <!-- namespace ate-system -->
  <rect x="620" y="284" width="388" height="116" rx="6" fill="#f8f9fa" stroke="#dadce0" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="632" y="299" font-size="9.5" font-weight="700" fill="#5f6368" letter-spacing="1">NAMESPACE ATE-SYSTEM · AGENT SUBSTRATE 0.6.0-ALPHA3</text>

  <rect x="632" y="308" width="116" height="80" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1.2"/>
